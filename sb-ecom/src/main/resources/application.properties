spring.application.name=sb-ecom

#Database configuration
#jdbc is a connection protocol, h2 is database itself, mem means in-memory database itself. test is the name of the in-memory database itself.
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:test

project.image = images/

#Additional Properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update


#JWT Config
spring.app.jwtSecret=mySecretKey123912738aopsgjnspkmndfsopkvajoirjg94gf2opfng2moknm
spring.app.jwtExpirationMs=3000000
spring.app.ecom.jwtCookieName=springBootEcom

logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.ecommerce.project=DEBUG



